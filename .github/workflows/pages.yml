name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Perl is only needed to build; the site itself is static.
      - name: Install build dependencies
        run: sudo apt-get install -y libfile-which-perl libtemplate-perl liburi-perl

      # docs/ holds the javadoc, CNAME, etc.; the build fills in the rest.
      - name: Build
        run: |
          ./configure -Db=docs
          make
          find docs -name .ok -delete

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
