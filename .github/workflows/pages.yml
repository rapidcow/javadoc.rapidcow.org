name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
    paths-ignore:
      - "configure.*"
      - "README.md"
      - "view"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The build script, www-siteconf, comes from one repository in three
  # parts: engine needs gengenlib, and the web preset (configure, and
  # the render script) needs genlib.  Each ref's first component names
  # the directory to build.
  SITECONF_URL: https://github.com/rapidcow/siteconf.git
  GENGENLIB_REF: gengenlib/v0.00_00
  GENLIB_REF: genlib/v0.01_00
  ENGINE_REF: engine/v0.01_00

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Perl is only needed to build; the site itself is static.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtemplate-perl liburi-perl \
            libfile-sharedir-perl libfile-sharedir-install-perl

      - name: Install siteconf
        run: |
          prefix="$RUNNER_TEMP/siteconf"
          export PERL5LIB="$prefix/lib/perl5"
          for ref in "$GENGENLIB_REF" "$GENLIB_REF" "$ENGINE_REF"; do
            part=${ref%%/*}
            git -c advice.detachedHead=false clone --quiet --depth 1 \
              --branch "$ref" "$SITECONF_URL" "$RUNNER_TEMP/src/$part"
            (cd "$RUNNER_TEMP/src/$part/$part" &&
              perl Makefile.PL INSTALL_BASE="$prefix" &&
              make && make install)
          done
          echo "PERL5LIB=$PERL5LIB" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      # docs/ holds the javadoc, CNAME, etc.; the build fills in the rest.
      - name: Build
        run: |
          ./configure -Db=docs
          siteconf -g
          make
          find docs -name .ok -delete

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
